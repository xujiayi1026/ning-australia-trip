<body>
<div id="wrap">

<script>
"use strict";
/* ================= 基础 ================= */
var cv=document.getElementById('cv'),g=cv.getContext('2d');
var W=480,H=270;
g.imageSmoothingEnabled=false;
var ui=document.getElementById('ui'),wrap=document.getElementById('wrap');
var SCALE=2;
function resize(){
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  if(!isFinite(s)||s<=0)s=1;
  var full=!!(document.fullscreenElement||document.webkitFullscreenElement);
  if(!full)s=Math.min(s,1280/W);
  SCALE=s;
  var w=Math.max(1,Math.round(W*s)),h=Math.max(1,Math.round(H*s));
  cv.style.width=w+'px';cv.style.height=h+'px';
  wrap.style.width=w+'px';wrap.style.height=h+'px';
  ui.style.width=W+'px';ui.style.height=H+'px';
  ui.style.transformOrigin='0 0';
  ui.style.transform='scale('+s+')';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,120);});
resize();

/* ================= 全屏 ================= */
function toggleFull(){
  var d=document,el=d.documentElement;
  var full=d.fullscreenElement||d.webkitFullscreenElement;
  try{
    if(!full){
      var f=el.requestFullscreen||el.webkitRequestFullscreen;
      if(f){f.call(el);setTimeout(resize,200);}
      else toast('此浏览器不支持全屏，画面已自动铺满窗口');
    }else{
      var x=d.exitFullscreen||d.webkitExitFullscreen;
      if(x)x.call(d);
    }
  }catch(e){toast('无法进入全屏');}
}
document.addEventListener('fullscreenchange',function(){setTimeout(resize,60);});

function $(id){return document.getElementById(id)}
function hide(){for(var i=0;i<arguments.length;i++)$(arguments[i]).classList.add('hidden')}
function show(){for(var i=0;i<arguments.length;i++)$(arguments[i]).classList.remove('hidden')}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function rnd(a,b){return a+Math.random()*(b-a)}
function irnd(a,b){return Math.floor(rnd(a,b+1))}
function dist(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy)}
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r+amt),0,255);gg=clamp(Math.round(gg+amt),0,255);b=clamp(Math.round(b+amt),0,255);
  return '#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);
}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)}
function txt(s,x,y,c,size,align){
  g.fillStyle=c||'#fff';g.textAlign=align||'left';g.textBaseline='top';
  g.font='bold '+(size||8)+'px "Courier New",monospace';
  g.fillText(s,x,y);
}
var toastT=0;
function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');toastT=2.2;
}

/* ================= 背景音乐（Web Audio 程序化生成 · 星露谷式民谣） ================= */
var BGM={ctx:null,master:null,muted:false,on:false,step:0,next:0,timer:null};
var BPM=88,SPU=60/BPM/2;
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
var CHORDS=[ /* 8 小节循环：G Em C D | G Em C D  [根音, 1,2,3,4] */
  [43,55,59,62,67],[40,52,55,59,64],[36,52,55,60,64],[38,50,54,57,62],
  [43,55,59,62,67],[40,52,55,59,64],[36,52,55,60,64],[38,50,54,57,62]
];
var ARP=[1,2,3,4,2,3,4,3];
var MEL=[
  [4,74,2],[6,71,2],[8,76,3],[12,74,2],[14,71,2],
  [16,72,2],[18,76,2],[20,74,4],[24,69,2],[26,74,2],[28,71,4],
  [32,71,2],[34,74,2],[36,67,4],[40,76,3],[44,71,3],
  [48,72,2],[50,69,2],[52,67,2],[54,69,2],[56,67,6]
];
function vPluck(t,m,v,dur){
  var c=BGM.ctx,o=c.createOscillator(),gn=c.createGain(),lp=c.createBiquadFilter();
  o.type='triangle';o.frequency.value=mtof(m);
  lp.type='lowpass';lp.frequency.value=2400;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(v,t+0.015);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp);lp.connect(gn);gn.connect(BGM.master);
  o.start(t);o.stop(t+dur+0.05);
}
function vBass(t,m,v,dur){
  var c=BGM.ctx,o=c.createOscillator(),gn=c.createGain(),lp=c.createBiquadFilter();
  o.type='sine';o.frequency.value=mtof(m);
  lp.type='lowpass';lp.frequency.value=700;
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(v,t+0.02);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp);lp.connect(gn);gn.connect(BGM.master);
  o.start(t);o.stop(t+dur+0.05);
}
function vFlute(t,m,v,dur){
  var c=BGM.ctx,o=c.createOscillator(),gn=c.createGain(),
      vb=c.createOscillator(),vg=c.createGain();
  o.type='sine';o.frequency.value=m;
  vb.frequency.value=5.2;vg.gain.value=m*0.005;
  vb.connect(vg);vg.connect(o.frequency);
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(v,t+0.09);
  gn.gain.setValueAtTime(v,t+dur*0.6);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn);gn.connect(BGM.master);
  o.start(t);vb.start(t);o.stop(t+dur+0.1);vb.stop(t+dur+0.1);
}
function bgmEnsure(){
  if(BGM.ctx)return true;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  try{BGM.ctx=new AC();}catch(e){return false;}
  BGM.master=BGM.ctx.createGain();
  BGM.master.gain.value=BGM.muted?0:0.5;
  BGM.master.connect(BGM.ctx.destination);
  return true;
}
function bgmResume(){if(BGM.ctx&&BGM.ctx.state==='suspended')BGM.ctx.resume();}
function bgmStart(){
  if(!bgmEnsure())return;
  bgmResume();
  if(BGM.on)return;
  BGM.on=true;BGM.step=0;
  BGM.next=BGM.ctx.currentTime+0.2;
  BGM.timer=setInterval(bgmTick,90);
}
function bgmTick(){
  if(!BGM.on||!BGM.ctx||BGM.ctx.state!=='running')return;
  var now=BGM.ctx.currentTime;
  if(BGM.next<now)BGM.next=now+0.03;
  while(BGM.next<now+0.3){
    var s=BGM.step%64,bar=(s/8)|0,inb=s%8,ch=CHORDS[bar];
    if(inb===0||inb===4)vBass(BGM.next,ch[0],0.26,0.55);
    if(inb===4&&bar%2===1)vBass(BGM.next,ch[0]+7,0.15,0.3);
    vPluck(BGM.next,ch[ARP[inb]],0.15,0.45);
    for(var i=0;i<MEL.length;i++)if(MEL[i][0]===s)
      vFlute(BGM.next,mtof(MEL[i][1]),0.17,MEL[i][2]*SPU*0.95);
    BGM.next+=SPU;BGM.step++;
  }
}
function bgmToggle(){
  if(!BGM.ctx&&!bgmEnsure()){toast('当前浏览器不支持音频');return;}
  BGM.muted=!BGM.muted;
  BGM.master.gain.value=BGM.muted?0:0.5;
  if(SFX.gain)SFX.gain.gain.value=BGM.muted?0:0.9;
  if(BGM.muted){bgmStop();stopRumble();stopWave();}
  else bgmStart();
  $('bgmLbl').textContent=BGM.muted?'音乐 关':'音乐';
  toast(BGM.muted?'背景音乐与音效已关闭':'背景音乐与音效已开启');
}
function bgmStop(){BGM.on=false;if(BGM.timer){clearInterval(BGM.timer);BGM.timer=null;}}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){stopRumble();stopWave();if(BGM.on){bgmStop();BGM._wasOn=true;}}
  else if(BGM._wasOn){BGM._wasOn=false;bgmStart();}
});

/* ================= 场景音效（程序生成 · 与画面同步） ================= */
var SFX={gain:null,noise:null,wave:null,rumble:null,crashT:4,stepT:0,prevTramX:null,clackIdx:null};
function sfxInit(){
  if(!bgmEnsure())return false;
  if(!SFX.gain){SFX.gain=BGM.ctx.createGain();SFX.gain.gain.value=BGM.muted?0:0.9;SFX.gain.connect(BGM.ctx.destination);}
  if(!SFX.noise){
    var c=BGM.ctx,len=Math.floor(c.sampleRate*2);
    var b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    SFX.noise=b;
  }
  return true;
}
function sfxOn(){return sfxInit()&&BGM.ctx.state==='running'&&!BGM.muted;}
function noiseBurst(t,dur,rate,ftype,freq,peak,atk){
  if(!sfxOn())return;
  var c=BGM.ctx,s=c.createBufferSource();
  s.buffer=SFX.noise;s.loop=true;s.playbackRate.value=rate||1;
  var f=c.createBiquadFilter();f.type=ftype||'lowpass';f.frequency.value=freq||800;
  var gn=c.createGain();
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(Math.max(0.002,peak),t+(atk||0.01));
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(gn);gn.connect(SFX.gain);
  s.start(t);s.stop(t+dur+0.05);
}
function tone(t,type,freq,freq2,dur,peak){
  if(!sfxOn())return;
  var c=BGM.ctx,o=c.createOscillator(),gn=c.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur*0.85);
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(peak,t+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(gn);gn.connect(SFX.gain);
  o.start(t);o.stop(t+dur+0.05);
}
/* 脚步声 */
function footstep(){
  if(!sfxOn())return;
  var t=BGM.ctx.currentTime;
  noiseBurst(t,0.1,0.5+Math.random()*0.25,'lowpass',460+Math.random()*300,0.3,0.006);
  tone(t+0.006,'sine',132,72,0.09,0.13);
}
/* 海浪（海滩常驻） */
function startWave(){
  if(SFX.wave||!sfxInit())return;
  var c=BGM.ctx;
  var s=c.createBufferSource();s.buffer=SFX.noise;s.loop=true;
  var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=760;bp.Q.value=0.5;
  var gn=c.createGain();gn.gain.value=0.1;
  var lfo=c.createOscillator(),lg=c.createGain();
  lfo.frequency.value=0.14;lg.gain.value=0.075;
  lfo.connect(lg);lg.connect(gn.gain);
  s.connect(bp);bp.connect(gn);gn.connect(SFX.gain);
  try{s.start();lfo.start();}catch(e){}
  SFX.wave={s:s,l:lfo};
}
function stopWave(){
  if(!SFX.wave)return;
  try{SFX.wave.s.stop();SFX.wave.l.stop();}catch(e){}
  SFX.wave=null;
}
function waveCrash(){
  if(!sfxOn())return;
  var c=BGM.ctx,t=c.currentTime,s=c.createBufferSource();
  s.buffer=SFX.noise;s.loop=true;
  var f=c.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(420,t);
  f.frequency.linearRampToValueAtTime(2800,t+0.55);
  f.frequency.linearRampToValueAtTime(500,t+1.9);
  var gn=c.createGain();
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.linearRampToValueAtTime(0.3,t+0.5);
  gn.gain.linearRampToValueAtTime(0.0001,t+2.0);
  s.connect(f);f.connect(gn);gn.connect(SFX.gain);
  s.start(t);s.stop(t+2.1);
}
/* 电车（火车站，与画面 tramX 完全同步） */
function startRumble(){
  if(SFX.rumble||!sfxInit())return;
  var c=BGM.ctx;
  var s=c.createBufferSource();s.buffer=SFX.noise;s.loop=true;s.playbackRate.value=0.7;
  var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=260;
  var gn=c.createGain();gn.gain.value=0.0001;
  var hum=c.createOscillator();hum.type='sawtooth';hum.frequency.value=78;
  var hf=c.createBiquadFilter();hf.type='lowpass';hf.frequency.value=300;
  var hg=c.createGain();hg.gain.value=0.05;
  s.connect(lp);lp.connect(gn);
  hum.connect(hf);hf.connect(hg);hg.connect(gn);
  gn.connect(SFX.gain);
  try{s.start();hum.start();}catch(e){}
  SFX.rumble={s:s,h:hum,g:gn};
}
function stopRumble(){
  if(!SFX.rumble)return;
  try{SFX.rumble.s.stop();SFX.rumble.h.stop();}catch(e){}
  SFX.rumble=null;
}
function tramBell(){
  if(!sfxOn())return;
  var t=BGM.ctx.currentTime;
  tone(t,'triangle',1180,null,0.32,0.16);
  tone(t+0.17,'triangle',1520,null,0.42,0.14);
}
function tramClack(v){
  noiseBurst(BGM.ctx.currentTime,0.07,1.6,'bandpass',1700,v,0.004);
}
function updateStationSfx(t){
  if(!sfxInit())return;
  var tramX=((t*40)%620)-90;
  if(SFX.prevTramX!=null&&SFX.prevTramX<=-50&&tramX>-50)tramBell();
  SFX.prevTramX=tramX;
  if(tramX<-60||tramX>W+40){stopRumble();SFX.clackIdx=null;return;}
  if(!SFX.rumble)startRumble();
  if(SFX.rumble){
    var cx=tramX+43;
    var prox=1-clamp(Math.abs(cx-W/2)/(W*0.8),0,1);
    SFX.rumble.g.gain.value=(BGM.muted||BGM.ctx.state!=='running')?0.0001:0.05+prox*0.22;
    var idx=Math.floor((tramX+90)/16);
    if(SFX.clackIdx!=null&&idx!==SFX.clackIdx)tramClack(0.06+prox*0.16);
    SFX.clackIdx=idx;
  }
}
function updateAmbience(dt){
  if(G.mode!=='play'){stopRumble();stopWave();SFX.prevTramX=null;return;}
  if(G.scene==='station')updateStationSfx(tGlobal);
  else{stopRumble();SFX.prevTramX=null;SFX.clackIdx=null;}
  if(G.scene==='beach'){
    startWave();
    SFX.crashT-=dt;
    if(SFX.crashT<=0){waveCrash();SFX.crashT=rnd(3.4,6.2);}
  }else stopWave();
}

function defaultLook(){

/* ============ 角色绘制 x,y=脚底中心 frame0~3 ============ */
function drawChar(c,x,y,L,dir,frame,s){
  s=s||1;
  x=Math.round(x);y=Math.round(y);
  c.save();
  if(dir==='right'){c.translate(x*2,0);c.scale(-1,1);}
  function P(dx,dy,w,h,col){
    c.fillStyle=col;
    c.fillRect(Math.round(x+dx*s),Math.round(y+dy*s),Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)));
  }
  var side=(dir==='left'||dir==='right');
  var hc=HAIRC[L.hairC],sk=SKINC[L.skin],ec=EYEC[L.eye];
  var tp=TOPC[L.topC],tpD=shade(tp,-42);
  var bt=BOTC[L.botC],btD=shade(bt,-35);
  var sh=SHOEC[L.shoeC];
  var liftL=(frame===1),liftR=(frame===3);
  var skirt=(L.bot>=3);

  c.globalAlpha=.28;P(-5,0,10,2,'#000');c.globalAlpha=1;

  /* 腿 */
  if(skirt){
    P(-3,liftL?-5:-4,2,liftL?3:4,sk);
    P(1,liftR?-5:-4,2,liftR?3:4,sk);
  }else{
    if(side){P(-3,liftL?-4:-6,3,liftL?4:6,bt);P(0,liftR?-4:-6,3,liftR?4:6,btD);}
    else{P(-4,liftL?-4:-6,3,liftL?4:6,bt);P(1,liftR?-4:-6,3,liftR?4:6,bt);}
  }
  /* 鞋 */
  var lsy=liftL?-4:0,rsy=liftR?-4:0;
  if(L.shoe===1){P(-5,lsy-2,4,4,sh);P(1,rsy-2,4,4,sh);}
  else{P(-5,lsy-2,4,2,sh);P(1,rsy-2,4,2,sh);}

  /* 下装 */
  if(skirt){
    if(L.bot===4){P(-5,-9,10,2,bt);P(-6,-7,12,4,bt);P(-6,-3,12,3,btD);}
    else{P(-5,-9,10,2,bt);P(-6,-7,12,4,bt);}
  }else{
    P(-5,-9,10,4,bt);
    if(L.bot===1){P(-5,-9,1,4,'#5a7db5');P(4,-9,1,4,'#5a7db5');}
    if(L.bot===2)P(-5,-7,10,1,btD);
  }

  /* 手臂 */
  var aSw=(frame===1)?1:(frame===3)?-1:0;
  P(-7,-15+aSw,2,6,tp);P(-7,-9+aSw,2,2,sk);
  P(5,-15-aSw,2,6,tp);P(5,-9-aSw,2,2,sk);

  /* 上衣 */
  P(-5,-16,10,7,tp);
  if(L.top===1){P(-5,-17,10,2,tpD);P(-3,-12,6,3,tpD);}
  else if(L.top===2){P(-2,-16,4,6,'#f4f4ee');P(-3,-16,3,2,'#fff');P(1,-16,3,2,'#fff');P(0,-14,1,5,'#c8c8c0');}
  else if(L.top===3){P(-2,-16,4,6,'#f2f2ee');P(-4,-16,3,7,tpD);P(1,-16,3,7,tpD);}
  else if(L.top===4){for(var i=0;i<3;i++)P(-5,-15+i*2,10,1,tpD);}
  else if(L.top===5){P(-5,-10,10,1,tpD);P(-5,-16,10,1,tpD);}

  /* 头 */
  P(-5,-26,10,10,sk);
  if(side){P(-4,-19,1,2,shade(sk,-30));}
  /* 脸 */
  if(dir==='down'){
    P(-3,-22,2,2,ec);P(1,-22,2,2,ec);
    P(-3,-22,1,1,'#fff');P(1,-22,1,1,'#fff');
    P(-1,-18,2,1,shade(sk,-55));
    P(-4,-19,1,1,'#f0a0a0');P(3,-19,1,1,'#f0a0a0');
  }else if(side){
    P(-3,-22,2,2,ec);P(-3,-22,1,1,'#fff');
  }

  /* 头发 */
  drawHair(P,L.hair,dir,hc,sk);

  /* 裙子前摆盖腿 */
  if(skirt&&L.bot===4)P(-6,-4,12,1,btD);

  c.restore();
}

function drawHair(P,style,dir,hc,sk){
  var d=shade(hc,-30),l=shade(hc,28);
  var isSide=(dir==='left'||dir==='right'),back=(dir==='up');
  if(style===0){ /* 短发 */
    P(-6,-27,12,5,hc);
    P(-6,-23,2,3,hc);P(4,-23,2,3,hc);
    if(back)P(-5,-24,10,7,hc);
    P(-4,-25,3,1,l);
  }else if(style===1){ /* 中长发 */
    P(-6,-27,12,5,hc);
    P(-6,-23,3,7,hc);P(3,-23,3,7,hc);
    if(back)P(-5,-24,10,10,hc);
    if(isSide)P(2,-23,4,8,hc);
    P(-4,-25,3,1,l);
  }else if(style===2){ /* 长发 */
    P(-6,-27,12,5,hc);
    P(-7,-23,3,13,hc);P(4,-23,3,13,hc);
    if(back||isSide)P(-6,-24,12,15,hc);
    P(-6,-24,3,12,hc);
    P(-4,-25,3,1,l);
  }else if(style===3){ /* 丸子头 */
    P(-6,-27,12,5,hc);
    P(-2,-31,5,5,hc);P(-1,-30,2,1,l);
    P(-6,-23,2,3,hc);P(4,-23,2,3,hc);
    if(back)P(-5,-24,10,7,hc);
  }else if(style===4){ /* 双马尾 */
    P(-6,-27,12,5,hc);
    P(-9,-25,3,8,hc);P(6,-25,3,8,hc);
    P(-9,-25,3,2,l);P(6,-25,3,2,l);
    P(-6,-23,2,3,hc);P(4,-23,2,3,hc);
    if(back)P(-5,-24,10,7,hc);
  }else{ /* 卷卷发 */
    P(-7,-28,14,6,hc);
    P(-7,-24,3,4,hc);P(4,-24,3,4,hc);
    P(-6,-29,3,3,hc);P(3,-29,3,3,hc);
    P(-4,-30,3,2,l);
    if(back)P(-5,-24,10,7,hc);
  }
}

function tapWorld(x,y){
  if(G.mode!=='play')return;
  if(dialog.active){nextDialog();return;}
  if(panelOpen()||cardsOpen()||fish.on)return;
  var best=null,bd=1e9;
  for(var i=0;i<interactives.length;i++){
    var it=interactives[i],r=Math.max(16,it.r||26);
    var d=dist(x,y,it.x,it.y);
    if(d<r&&d<bd){bd=d;best=it;}
  }
  if(best){moveTarget={x:best.x,y:best.y,act:best};stuckT=0;return;}
  if(gold.visible&&!G.goldHome&&dist(x,y,gold.x,gold.y)<22){
    moveTarget={x:gold.x,y:gold.y,act:'gold'};stuckT=0;return;
  }
  var nx=clamp(x,bounds.x1,bounds.x2),ny=clamp(y,bounds.y1,bounds.y2);

var dialog={active:false,lines:[],idx:0,who:'',look:null,onEnd:null,lineShown:0,timer:0};
function startDialog(who,look,lines,onEnd){
  dialog.active=true;dialog.lines=lines;dialog.idx=0;dialog.who=who;
  dialog.look=look;dialog.onEnd=onEnd||null;dialog.lineShown=0;dialog.timer=0;
  show('dlg');renderDialog();
}
function renderDialog(){
  var full=dialog.lines[dialog.idx]||'';
  var d=full.slice(0,dialog.lineShown||0);
  $('dlgT').innerHTML='<span class="who">'+dialog.who+'</span>'+d;
  if(dialog.lineShown===0||dialog.lineShown>=full.length)drawPortrait($('dlgPv'),dialog.look,dialog.who);
}
function nextDialog(){
  var full=dialog.lines[dialog.idx]||'';
  if(dialog.lineShown<full.length){dialog.lineShown=full.length;renderDialog();return;}
  dialog.idx++;
  if(dialog.idx>=dialog.lines.length){
    dialog.active=false;hide('dlg');
    if(dialog.onEnd)dialog.onEnd();
    return;
  }
  dialog.lineShown=0;dialog.timer=0;renderDialog();
}
function drawPortrait(cvs,look,who){
  var c=cvs.getContext('2d');c.imageSmoothingEnabled=false;
  c.clearRect(0,0,cvs.width,cvs.height);
  c.fillStyle='#0e1230';c.fillRect(0,0,cvs.width,cvs.height);
  if(look){
    drawChar(c,cvs.width/2,cvs.height-4,look,'down',0,1.6);
  }else{
    c.fillStyle='#7ee0b0';c.font='bold 20px monospace';c.textAlign='center';
    c.fillText(who?who.charAt(0):'?',cvs.width/2,cvs.height/2+6);
  }
}

/* ================= 碰撞/移动 ================= */
var bounds={x1:16,x2:W-16,y1:168,y2:H-18};
function movePlayer(dt){
  var sp=68,dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx-=1;
  if(keys.ArrowRight||keys.KeyD)dx+=1;
  if(keys.ArrowUp||keys.KeyW)dy-=1;
  if(keys.ArrowDown||keys.KeyS)dy+=1;
  if(dx||dy)moveTarget=null;
  /* 触屏/鼠标拖动摇杆 */
  if(!dx&&!dy&&ptr.down&&ptr.drag){
    var jx=ptr.x-ptr.ox,jy=ptr.y-ptr.oy,mm=Math.sqrt(jx*jx+jy*jy);
    if(mm>6){
      var k=Math.min(1,(mm-6)/26);
      dx=jx/mm*k;dy=jy/mm*k;moveTarget=null;
    }
  }
  /* 点击地面：自动走过去 */
  if(!dx&&!dy&&moveTarget){
    var tx=moveTarget.x,ty=moveTarget.y;
    if(moveTarget.act==='gold'){tx=gold.x;ty=gold.y;}
    var td=dist(player.x,player.y,tx,ty);
    if(td<7){
      var act=moveTarget.act;moveTarget=null;stuckT=0;
      player.moving=false;player.frame=0;player.animT=0;
      if(act==='gold'){
        if(dist(player.x,player.y,gold.x,gold.y)<42)startDialog('小金鱼',goldLook(),goldLines());
      }else if(act){act.fn();}
      return;
    }
    dx=(tx-player.x)/td;dy=(ty-player.y)/td;
  }
  player.moving=!!(dx||dy);
  if(player.moving){
    SFX.stepT-=dt;
    if(SFX.stepT<=0){SFX.stepT=0.27;footstep();}
    var mag=Math.sqrt(dx*dx+dy*dy);
    if(mag>1){dx/=mag;dy/=mag;}
    var px=player.x,py=player.y;
    var step=sp*dt,nx=clamp(player.x+dx*step,bounds.x1,bounds.x2),ny=clamp(player.y,bounds.y1,bounds.y2);
    if(dx&&!blocked(nx,ny))player.x=nx;
    ny=clamp(player.y+dy*step,bounds.y1,bounds.y2);nx=player.x;
    if(dy&&!blocked(nx,ny))player.y=ny;
    if(player.x===px&&player.y===py){
      stuckT+=dt;
      if(stuckT>0.9){var hadT=!!moveTarget;moveTarget=null;stuckT=0;if(hadT)toast('走不过去～');}
    }else stuckT=0;
    if(Math.abs(dx)>Math.abs(dy))player.dir=dx<0?'left':'right';
    else player.dir=dy<0?'up':'down';
    player.animT+=dt*8;player.frame=Math.floor(player.animT)%4;
  }else{player.frame=0;player.animT=0;stuckT=0;}
}
function updateGold(dt){
  if(G.goldHome){
    if(G.scene==='island'){gold.visible=true;gold.x=376;gold.y=202;gold.frame=0;gold.dir='down';}
    else if(G.scene==='house'){gold.visible=true;gold.x=430;gold.y=230;gold.frame=0;gold.dir='down';}
    else gold.visible=false;
    return;
  }
  gold.visible=true;
  var d=dist(gold.x,gold.y,player.x,player.y);
  if(d>26){
    var tx=player.x-18,ty=player.y+4,k=Math.min(1,dt*3.4);
    var ox=gold.x,oy=gold.y;
    gold.x+=(tx-gold.x)*k;gold.y+=(ty-gold.y)*k;
    var ddx=gold.x-ox,ddy=gold.y-oy;
    if(Math.abs(ddx)>Math.abs(ddy))gold.dir=ddx<0?'left':'right';
    else if(ddy)gold.dir=ddy<0?'up':'down';
    gold.animT+=dt*8;gold.frame=Math.floor(gold.animT)%4;
  }else if(d<13){
    gold.x+=(gold.x-player.x)*dt*2;gold.y+=(gold.y-player.y)*dt*2;gold.frame=0;
  }else gold.frame=0;
}

function nearestInteractive(){
  var best=null,bd=1e9;
  for(var i=0;i<interactives.length;i++){
    var it=interactives[i],r=it.r||26;
    var d=dist(player.x,player.y,it.x,it.y);
    if(d<r&&d<bd){bd=d;best=it;}

}

/* ================= 钓鱼小游戏 ================= */
var fish={on:false,phase:0,wait:0,zone:0.3,zoneT:0,cur:0.5,vel:0,prog:0,got:null};
function startFishing(){
  if(fish.on)return;
  fish.on=true;fish.phase=0;fish.wait=rnd(1,2.4);fish.prog=0;fish.cur=0.5;fish.vel=0;
  fish.zone=rnd(0.15,0.6);fish.zoneT=0;
  show('fishUI');
  $('fSt').textContent='抛竿…等待鱼儿咬钩';
  $('fSp').textContent='稳住，等“！”出现再按住收线按钮';
  $('fZone').style.left=(fish.zone*100)+'%';
  $('fZone').style.width='26%';
}
function closeFishing(){fish.on=false;holdFish=false;hide('fishUI')}
(function bindHold(){
  var fh=$('fHold');
  fh.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();holdFish=true;bgmResume();});
  fh.addEventListener('pointerup',function(){holdFish=false;});
  fh.addEventListener('pointercancel',function(){holdFish=false;});
  fh.addEventListener('pointerleave',function(){holdFish=false;});
})();
function updateFishing(dt){
  if(!fish.on)return;
  if(fish.phase===0){
    fish.wait-=dt;
    $('fSt').textContent='浮漂轻轻晃动…';
    if(fish.wait<=0){
      fish.phase=1;fish.got=pickFish();
      $('fSt').textContent='！！鱼上钩了！';
      $('fSp').textContent='按住下方按钮收线，让游标停在绿色区域！';
      setTimeout(function(){if(fish.on&&fish.phase===1)fish.phase=2,fish.hold=0;},600);
    }
    return;
  }
  if(fish.phase===1)return;
  if(fish.phase===2){
    fish.zoneT-=dt;
    if(fish.zoneT<=0){fish.zone=rnd(0.05,0.65);fish.zoneT=rnd(0.7,1.4);
      $('fZone').style.left=(fish.zone*100)+'%';}
    var hold=keys.Space||holdFish;
    fish.vel+=(hold?-1.9:1.5)*dt;
    fish.vel*=0.94;
    fish.cur=clamp(fish.cur+fish.vel*dt,0,1);
    var inZ=fish.cur>=fish.zone&&fish.cur<=fish.zone+0.26;
    fish.prog=clamp(fish.prog+(inZ?0.42:-0.3)*dt,0,1);
    $('fCur').style.left=(fish.cur*100)+'%';
    $('fSt').textContent=inZ?'收线中…':'鱼要跑了！';
    $('fSp').textContent='进度 '+Math.round(fish.prog*100)+'%　'+(inZ?'▲ 稳住':'▼ 快跟上');
    if(fish.prog>=1){
      fish.phase=3;
      addFish(fish.got.id);
      $('fSt').textContent='钓到了 '+fish.got.n+'！';
      $('fSp').textContent='太棒了！自动收竿～';
      setTimeout(closeFishing,1400);
    }else if(fish.prog<=0){
      fish.phase=3;
      $('fSt').textContent='鱼跑了…';
      $('fSp').textContent='别灰心，再抛一竿！';
      setTimeout(closeFishing,1200);
    }
  }
}
function pickFish(){
  var pool=[];
  for(var i=0;i<FISHES.length;i++){
    var w=FISHES[i].rare===0?30:FISHES[i].rare===1?14:FISHES[i].rare===2?6:2;
    for(var k=0;k<w;k++)pool.push(FISHES[i]);
  }
  return pool[irnd(0,pool.length-1)];
}

function paintIcon(c,kind,key,has){
  var X=c.getContext('2d');X.imageSmoothingEnabled=false;
  X.fillStyle='#fdf6e2';X.fillRect(0,0,16,16);
  if(!has){
    X.fillStyle='#b08d55';
    X.fillRect(5,3,6,2);X.fillRect(9,5,2,2);X.fillRect(7,7,3,2);
    X.fillRect(7,9,2,1);X.fillRect(7,11,2,3);X.fillRect(5,11,2,2);
    return;
  }
  if(kind==='fish'){
    var sv=g;g=X;
    drawMiniFish(8,8,key,true);
    g=sv;
    X.fillStyle='rgba(90,150,200,.5)';X.fillRect(11,3,2,1);X.fillRect(12,1,1,1);
  }else drawItemArt(X,key);
}
function paintIcons(root){
  var cs=root.querySelectorAll('canvas[data-ic]');
  for(var i=0;i<cs.length;i++){
    var c=cs[i],kind=c.getAttribute('data-ic'),key=c.getAttribute('data-id'),
        has=c.getAttribute('data-has')==='1';
    if(kind==='fish'){
      var col='#8fb3c9';
      for(var f=0;f<FISHES.length;f++)if(FISHES[f].id===key)col=FISHES[f].c;
      paintIcon(c,'fish',col,has);
    }else paintIcon(c,'item',key,has);
  }
}

    '<canvas class="ic" width="16" height="16" data-ic="fish" data-id="seahor" data-has="1"></canvas>'+
    '</div>';
  var body=$('pgR'),html='<h4>◆ 放养管理</h4><div class="grid">';
  for(var f2=0;f2<FISHES.length;f2++){
    var fd=FISHES[f2],n=G.fish[fd.id]||0,inLake=have[fd.id]||0;
    html+='<div class="item'+(n?'':' lock')+'">'+
      '<canvas class="ic" width="16" height="16" data-ic="fish" data-id="'+fd.id+'" data-has="'+(n?1:0)+'"></canvas>'+
      '<b style="color:'+(n?fd.c:'#7d6644')+'">'+(n?fd.n:'？？？')+'</b>';
    if(n<=0)html+='<span class="no">还没钓到</span>';
    else{
      html+='图鉴 '+n+' · 湖中 '+inLake+'<br>';
      if(inLake>0)html+='<span class="btn" data-lakeout="'+fd.id+'">捞回</span> ';
      if(n>inLake)html+='<span class="btn" style="background:#2e6b4f;border-color:#78d6a5" data-lakein="'+fd.id+'">放入</span>';
    }
    html+='</div>';
  }
  html+='</div>';
  body.innerHTML=html;
  paintIcons(L);paintIcons(body);
  var ins=body.querySelectorAll('[data-lakein]');
  for(var a=0;a<ins.length;a++)ins[a].onclick=function(){
    var id=this.getAttribute('data-lakein');
    var haveN=0;for(var i2=0;i2<G.lake.length;i2++)if(G.lake[i2]===id)haveN++;
    if(haveN<(G.fish[id]||0)){G.lake.push(id);toast('放了一条进湖里～');saveGame();openLake();}
  };
  var outs=body.querySelectorAll('[data-lakeout]');
  for(var b=0;b<outs.length;b++)outs[b].onclick=function(){
    var id=this.getAttribute('data-lakeout');
    for(var i3=0;i3<G.lake.length;i3++){if(G.lake[i3]===id){G.lake.splice(i3,1);break;}}
    toast('捞回了 1 条');saveGame();openLake();
  };
}

    txt('第一章 · 墨尔本',W/2,140,'#9fd7ff',11,'center');
    if(t>=INTRO_LEN){finishIntro();}
  }
}
function sky2(a,b){
  for(var i=0;i<14;i++){
    var tt=i/13;
    var c1=parseInt(a.slice(1),16),c2=parseInt(b.slice(1),16);
    var r=Math.round(((c1>>16)&255)+(((c2>>16)&255)-((c1>>16)&255))*tt);
    var gg=Math.round(((c1>>8)&255)+(((c2>>8)&255)-((c1>>8)&255))*tt);
    var bb=Math.round((c1&255)+((c2&255)-(c1&255))*tt);
    R(0,i*20,W,21,'rgb('+r+','+gg+','+bb+')');
  }
}
function cloud2(x,y,s,c){
  R(x,y+4,26*s,7*s,c);R(x+5,y,14*s,6*s,c);R(x+16,y+6,12*s,5*s,shade(c,14));
}
function drawPlane(x,y){
  R(x-26,y-4,52,9,'#e8ecf5');

  R(x-1,y-2,5,3,'#8fd0e8');

}
function drawAusSil(){
  g.fillStyle='#4a90d9';g.strokeStyle='#1e4f8a';g.lineWidth=3;
  g.beginPath();
  var pts=[[46,140],[60,110],[90,96],[130,80],[170,58],[210,52],[246,58],[250,74],[286,58],[330,52],[356,74],[368,110],[372,150],[366,190],[350,224],[330,244],[318,268],[300,276],[286,258],[268,244],[240,246],[210,250],[180,252],[150,244],[118,250],[86,244],[58,222],[44,190],[40,164]];

function typeLine2(s,el,x,y,color,size){
  if(el<=0)return;
  var dur=1.2;
  var n=Math.min(s.length,Math.ceil(s.length*clamp(el/dur,0,1)));
  g.font='bold '+size+'px "Microsoft YaHei",sans-serif';
  g.fillStyle=color;g.textAlign='center';g.textBaseline='top';
  g.fillText(s.slice(0,n),x,y);

function finishIntro(){

/* ================= 角色创建 ================= */
var OPTS=[
  {k:'hair',n:'头发',list:HAIRS},
  {k:'skin',n:'肤色',list:SKINC,color:true},
  {k:'eye', n:'眼睛',list:EYEC,color:true},
  {k:'top', n:'上衣',list:TOPS},
  {k:'bot', n:'裤子/裙',list:BOTS},
  {k:'shoe',n:'鞋子',list:SHOES}
];
var COLOR_OPTS=[
  {k:'hairC',n:'发色',list:HAIRC},
  {k:'topC', n:'衣色',list:TOPC},
  {k:'botC', n:'裤色',list:BOTC},
  {k:'shoeC',n:'鞋色',list:SHOEC}
];
var creatorBack=false,pvFrame=0,pvT=0,creatorPos=null;
function openCreator(isBack){
  creatorBack=!!isBack;
  creatorPos=isBack?{s:G.scene,x:player.x,y:player.y}:null;
  G.mode='creator';
  hide('titleScr','hud','panel','cards','dlg','hint');
  show('creator');
  $('btnCreBack').classList.toggle('hidden',!isBack);
  $('btnStart').textContent=isBack?'保存返回':'出发！';
  $('inName').value=G.name;
  $('pvName').textContent=G.name;
  buildOptRows();
}
function buildOptRows(){
  var html='';
  function row(label,list,k,colors){
    var h='<div class="row"><span class="lb">'+label+'</span>'+
      '<span class="chip" data-k="'+k+'" data-d="-1">◀</span>'+
      '<span class="val" id="v_'+k+'"></span>'+
      '<span class="chip" data-k="'+k+'" data-d="1">▶</span>';
    if(colors)h+='<span class="lb" style="width:auto;margin-left:8px">色</span>'+swatches(colors);
    h+='</div>';
    return h;
  }
  for(var i=0;i<OPTS.length;i++){
    var o=OPTS[i];
    html+=row(o.n,o.list,o.k,(o.k==='skin'||o.k==='eye')?{k:o.k,list:(o.k==='skin')?SKINC:EYEC}:null);
  }
  html+='<div class="row" style="flex-wrap:wrap"><span class="lb" style="width:100%;margin-bottom:3px">配色</span>';
  for(var c=0;c<COLOR_OPTS.length;c++){
    var co=COLOR_OPTS[c];
    html+='<span class="lb" style="width:44px;font-size:11px">'+co.n+'</span>'+swatches(co);
  }
  html+='</div>';
  $('optRows').innerHTML=html;
  var chips=$('optRows').querySelectorAll('.chip');
  for(var ci=0;ci<chips.length;ci++)chips[ci].onclick=function(){
    var k=this.getAttribute('data-k'),d=+this.getAttribute('data-d');
    stepOpt(k,d);
  };
  var sws=$('optRows').querySelectorAll('.sw');
  for(var si=0;si<sws.length;si++)sws[si].onclick=function(){
    var k=this.getAttribute('data-k'),v=+this.getAttribute('data-v');
    G.look[k]=v;syncOpt();
  };
  syncOpt();
}
function swatches(co){
  var h='';
  for(var i=0;i<co.list.length;i++)
    h+='<span class="sw" data-k="'+co.k+'" data-v="'+i+'" style="background:'+co.list[i]+'"></span>';
  return h;
}
function stepOpt(k,d){
  var len=null;
  for(var i=0;i<OPTS.length;i++)if(OPTS[i].k===k)len=OPTS[i].list.length;
  for(var j=0;j<COLOR_OPTS.length;j++)if(COLOR_OPTS[j].k===k)len=COLOR_OPTS[j].list.length;
  if(!len)return;
  G.look[k]=((G.look[k]||0)+d+len)%len;
  syncOpt();
}
function syncOpt(){
  for(var i=0;i<OPTS.length;i++){
    var o=OPTS[i],el=$('v_'+o.k);
    var idx=(G.look[o.k]||0),nm=o.list[idx];
    if(typeof nm==='string'&&nm.charAt(0)==='#')nm='色 '+(idx+1);
    if(el)el.textContent=(idx+1)+'/'+o.list.length+' '+nm;
  }
  var sws=$('optRows').querySelectorAll('.sw');
  for(var s=0;s<sws.length;s++){
    var k=sws[s].getAttribute('data-k'),v=+sws[s].getAttribute('data-v');
    sws[s].classList.toggle('on',G.look[k]===v);
  }
}
function randomLook(){
  G.look={
    hair:irnd(0,HAIRS.length-1),hairC:irnd(0,HAIRC.length-1),
    skin:irnd(0,SKINC.length-1),eye:irnd(0,EYEC.length-1),
    top:irnd(0,TOPS.length-1),topC:irnd(0,TOPC.length-1),
    bot:irnd(0,BOTS.length-1),botC:irnd(0,BOTC.length-1),
    shoe:irnd(0,SHOES.length-1),shoeC:irnd(0,SHOEC.length-1)
  };
  syncOpt();
}
$('btnNew').onclick=function(){G.items={};G.fish={};G.lake=[];G.goldHome=false;startIntro();};

$('btnCreBack').onclick=function(){saveGame();backFromCreator();};
function backFromCreator(msg){
  var p=creatorPos;
  if(p)enterScene(p.s,p.x,p.y);
  else enterScene('house');
  if(msg)toast(msg);
}
$('inName').oninput=function(){$('pvName').textContent=this.value||'宁';};
/* ================= HUD 按钮 ================= */
$('bMap').onclick=function(){ if(G.mode==='map')enterScene(G.scene); else openMap(); };
$('bScene').onclick=function(){ if(G.mode==='play')openCards(); };

/* HUD 像素小图标（9x9） */

  function P(a,b,w,h,c){X.fillStyle=c;X.fillRect(a,b,w,h);}
  X.clearRect(0,0,9,9);
  if(k==='map'){
    P(0,2,3,5,'#e8d7a8');P(3,1,3,7,'#cfe0b8');P(6,2,3,5,'#e8d7a8');
    P(2,2,1,5,'#a08455');P(5,2,1,5,'#a08455');
    P(6,4,2,2,'#e8384f');
  }else if(k==='scene'){
    P(0,1,9,7,'#f7f3e6');P(1,2,7,5,'#8fd0e8');
    P(1,6,4,1,'#3f7f5a');P(3,4,3,3,'#2f6b4a');P(5,6,3,1,'#3f7f5a');
    P(6,2,2,2,'#ffe066');
  }else if(k==='book'){
    P(0,2,4,6,'#f2e5c1');P(5,2,4,6,'#f2e5c1');
    P(0,2,4,1,'#c9a44a');P(5,2,4,1,'#c9a44a');
    P(4,2,1,6,'#7a3b1e');
    P(1,4,2,1,'#a08455');P(6,4,2,1,'#a08455');P(1,6,2,1,'#a08455');P(6,6,2,1,'#a08455');
  }else if(k==='cloth'){
    P(2,1,5,2,'#4a90d9');P(0,2,2,3,'#4a90d9');P(7,2,2,3,'#4a90d9');
    P(2,3,5,5,'#3f7fc0');P(3,1,3,1,'#2f5f9a');
  }else if(k==='fish'){
    P(1,3,6,4,'#f08a2a');P(1,3,6,1,'#f7a94f');P(7,2,2,6,'#d9741f');
    P(2,4,1,1,'#fff');P(3,4,1,1,'#222');P(2,7,2,1,'#d9741f');
  }else if(k==='music'){
    P(6,0,2,2,'#ffe9a8');P(6,2,1,5,'#ffe9a8');P(4,2,3,1,'#ffd873');
    P(3,6,4,2,'#ffe9a8');P(4,5,2,1,'#ffd873');
  }else if(k==='full'){
    P(0,0,3,1,'#7ee0b0');P(0,0,1,3,'#7ee0b0');

    P(0,8,3,1,'#7ee0b0');P(0,6,1,3,'#7ee0b0');
    P(6,8,3,1,'#7ee0b0');P(8,6,1,3,'#7ee0b0');
  }
}
function paintHudIcons(){
  var cs=document.querySelectorAll('canvas.hi');
  for(var i=0;i<cs.length;i++){
    var X=cs[i].getContext('2d');X.imageSmoothingEnabled=false;
    drawHudIcon(X,cs[i].getAttribute('data-hi'));
  }
}
paintHudIcons();

/* ================= 预览绘制 ================= */
var pvCvs=$('pv'),pvG=pvCvs.getContext('2d');
function drawPreview(){
  pvG.imageSmoothingEnabled=false;
  pvG.fillStyle='#10142c';pvG.fillRect(0,0,pvCvs.width,pvCvs.height);
  pvG.fillStyle='#1a2144';
  for(var i=0;i<4;i++)pvG.fillRect(0,110+i*8,pvCvs.width,4);
  var sv=g;g=pvG;
  drawChar(pvG,45,118,G.look,'down',pvFrame,3);
  g=sv;
}

/* ================= 主循环 ================= */
var last=0,tGlobal=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  tGlobal+=dt;
  update(dt);
  render(tGlobal);
  requestAnimationFrame(loop);
}
function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('show');}
  syncActBtns();
  updateAmbience(dt);
  if(G.mode==='intro'){intro.t+=dt;return;}
  if(G.mode==='creator'){pvT+=dt;if(pvT>0.28){pvT=0;pvFrame=(pvFrame+1)%4;}drawPreview();return;}
  if(G.mode==='play'){
    if(!dialog.active&&!panelOpen()&&!cardsOpen()&&!fish.on){
      movePlayer(dt);updateGold(dt);
    }
    updateFishing(dt);
    if(dialog.active){
      var full=dialog.lines[dialog.idx]||'';
      if(dialog.lineShown<full.length){
        dialog.timer+=dt;
        var target=Math.min(full.length,Math.floor(dialog.timer*28));
        if(target>dialog.lineShown){dialog.lineShown=target;renderDialog();}
      }
    }
    updateHint();
  }
}
function render(t){
  g.clearRect(0,0,W,H);
  if(G.mode==='title'){
    drawTitleBg(t);return;
  }
  if(G.mode==='intro'){drawIntro(intro.t);return;}
  if(G.mode==='creator'){drawTitleBg(t);return;}
  if(G.mode==='map'){drawMap(t);return;}
  if(G.mode==='play'){drawPlay(t);return;}
}
function drawTitleBg(t){
  sky('#1c2a5c','#3a2a5c');
  for(var i=0;i<70;i++){
    var sx=(i*97)%W,sy=(i*53)%(H-40);
    R(sx,sy,1,1,(Math.sin(t*2.5+i)+1)/2?'#e8ecff':'#5a6a9a');
  }
  R(0,196,W,74,'#1a3a5c');
  for(var x=0;x<W;x+=9){
    var o=Math.sin(x*0.05+t*1.6)*3;
    R(x,196+o,7,2,'#2f6a9c');
  }
  /* 远景墨尔本天际线 */
  var sk=['#232a4a','#1e2440','#283054'];
  for(var b=0;b<10;b++){
    var bw=40,bh=30+((b*47)%70),bx=b*50-8;
    R(bx,196-bh,bw,bh,sk[b%3]);
    for(var wy=0;wy<bh-8;wy+=10)for(var wx=0;wx<bw-8;wx+=10)
      if((b+wy+wx)%3)R(bx+4+wx,196-bh+5+wy,4,4,'rgba(255,233,168,.6)');
  }
  cloud(((t*7)%560)-60,36,1);cloud(((t*4+220)%560)-60,64,0.7);
  drawPlane(((t*36)%600)-70,120+Math.sin(t*1.2)*5);
}
function drawPlay(t){
  var scene=G.scene;
  if(scene==='station')drawStation(t);
  else if(scene==='beach')drawBeach(t);
  else if(scene==='island')drawIsland(t);
  else if(scene==='house')drawHouse(t);

  /* 场景内物件互动提示点 */
  var ents=[];
  if(scene==='station'||scene==='beach'){
    /* NPC 已包含在 interactives 里，用 look 信息单独记录绘制 */
  }
  /* 绘制 NPC（从 NPC_LOOKS 需位置）— 用 npcDrawList */
  for(var i=0;i<npcDraw.length;i++)ents.push(npcDraw[i]);
  if(gold.visible)ents.push({x:gold.x,y:gold.y,kind:'gold'});
  ents.push({x:player.x,y:player.y,kind:'player'});
  ents.sort(function(a,b){return a.y-b.y;});
  for(var e=0;e<ents.length;e++){
    var en=ents[e];
    if(en.kind==='player')drawChar(g,en.x,en.y,G.look,player.dir,player.frame,1);
    else if(en.kind==='gold')drawChar(g,en.x,en.y,goldLook(),gold.dir,gold.frame,1);
    else if(en.look){
      drawChar(g,en.x,en.y,en.look,en.dir||'down',en.frame||0,1);
      if(dist(player.x,player.y,en.x,en.y)<40)txt(en.name,en.x,en.y-34,'#dfffe9',7,'center');
    }
  }

  /* 点击移动目标标记 */
  if(moveTarget&&G.mode==='play'){
    var mtx=moveTarget.x,mty=moveTarget.y;
    if(moveTarget.act==='gold'){mtx=gold.x;mty=gold.y;}
    var bob=Math.sin(t*7)*2;
    g.fillStyle='rgba(126,224,176,.92)';
    g.beginPath();g.moveTo(mtx,mty-22+bob);g.lineTo(mtx-5,mty-30+bob);g.lineTo(mtx+5,mty-30+bob);g.closePath();g.fill();
    R(mtx-4,mty-21+bob,8,2,'rgba(126,224,176,.5)');
  }
  /* 拖动摇杆指示 */
  if(ptr.down&&ptr.drag&&G.mode==='play'){
    g.globalAlpha=.3;g.fillStyle='#0b1024';
    g.beginPath();g.arc(ptr.ox,ptr.oy,20,0,6.2832);g.fill();
    g.globalAlpha=.8;g.fillStyle='#ffe9a8';
    var sjx=ptr.x-ptr.ox,sjy=ptr.y-ptr.oy,smm=Math.sqrt(sjx*sjx+sjy*sjy);
    if(smm>1){var sc=Math.min(smm,26)/smm;sjx*=sc;sjy*=sc;}
    g.beginPath();g.arc(ptr.ox+sjx,ptr.oy+sjy,8,0,6.2832);g.fill();
    g.globalAlpha=1;
  }

  /* 黑边字幕（场景名） */
  if(sceneT<2.4){
    var a=sceneT<0.4?sceneT/0.4:(sceneT>1.8?(2.4-scTSafe())/0.6:1);
    R(0,100,W,26,'rgba(8,12,28,'+(0.7*a)+')');
    txt(SCENES[scene].name,W/2,106,'rgba(255,233,168,'+a+')',13,'center');
  }
}
function scTSafe(){return sceneT;}
var sceneT=0,npcDraw=[];
function refreshNpcs(){
  npcDraw=[];
  var src=[];
  if(G.scene==='station')src=[
    {n:'电车司机老杰克',x:370,y:236,k:'jack',dir:'left'},
    {n:'街头画家小夏',x:430,y:196,k:'xia',dir:'down'},
    {n:'卖报的老爷爷',x:70,y:206,k:'gr',dir:'right'}];
  if(G.scene==='beach')src=[
    {n:'冲浪少年阿海',x:300,y:240,k:'hai',dir:'down'},
    {n:'看企鹅的老奶奶',x:370,y:220,k:'gm',dir:'left'},
    {n:'卖冲浪板的阿姨',x:120,y:246,k:'ay',dir:'right'}];
  for(var i=0;i<src.length;i++){
    npcDraw.push({x:src[i].x,y:src[i].y,look:NPC_LOOKS[src[i].k],name:src[i].n,dir:src[i].dir,kind:'npc'});
  }
}
var origBuild=buildInteractives;
buildInteractives=function(){origBuild();refreshNpcs();sceneT=0;};

/* ================= 启动 ================= */
setInterval(function(){if(G.mode==='play')sceneT+=0.05;},50);

(function boot(){
  var has=false;
  try{has=!!localStorage.getItem(SAVE_KEY);}catch(e){}
  if(has){$('btnCont').classList.remove('hidden');}else{$('btnCont').classList.add('hidden');}
  requestAnimationFrame(loop);
})();
